name: Supabase keep-alive

# Free Supabase projects pause after 7 days of inactivity. This pings the
# REST API on a schedule so the project stays awake. Remove once you have
# real daily traffic.

on:
  schedule:
    # Every 3 days at 06:00 UTC (well inside the 7-day window).
    - cron: "0 6 */3 * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repo secrets."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")
          echo "Supabase responded with HTTP $code"
          if [ "$code" = "000" ]; then
            echo "No response from Supabase."
            exit 1
          fi
