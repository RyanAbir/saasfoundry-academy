name: Supabase keep-alive

# The free Supabase project pauses after 7 days of inactivity (TECH-STACK.md §3).
# This workflow pings the REST API on a schedule so the project stays awake
# during the quiet early days. Remove it once the app has real daily traffic.

on:
  schedule:
    # Every 3 days at 06:00 UTC (well inside the 7-day window).
    - cron: "0 6 */3 * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repo secrets."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")
          echo "Supabase responded with HTTP $code"
          # Any HTTP response (even 401/404) proves the project is awake.
          if [ "$code" = "000" ]; then
            echo "No response from Supabase."
            exit 1
          fi
